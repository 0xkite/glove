name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A passing ubuntu-24.04 run has taken 68 minutes and a slow runner has
    # gone past 90 with nothing failing; clang-tidy alone is 45 to 60.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang clang-tidy libc++-dev libc++abi-dev libseccomp-dev libssl-dev ninja-build python3-venv
          echo "CXXFLAGS=-stdlib=libc++" >> "$GITHUB_ENV"

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        run: |
          brew install go llvm llvm@18 ninja
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++" >> "$GITHUB_ENV"

      - name: Install clang-format
        # Pinned to the exact version scripts/preflight.sh names as
        # formatted_for_clang_format. A formatter's output is only stable for one
        # version, so CI must not float: an unpinned install would reformat the
        # tree under us and turn every open PR red. Bumping this value, the
        # minimum in preflight.sh, and the resulting reformat belong in one PR.
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --disable-pip-version-check clang-format==23.1.1
          echo "$RUNNER_TEMP/clang-format/bin" >> "$GITHUB_PATH"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          clang-tidy --version
          clang-format --version
          "$(go env GOPATH)/bin/actionlint" --version

      - name: Add actionlint to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run preflight
        env:
          GLOVE_PREPARE_LINUX_USERNS: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: scripts/preflight.sh

  formal:
    name: TLA+ models
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fetch TLC
        # Pinned by content: a release asset can be replaced, a digest cannot.
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" \
            | sha256sum --check

      - name: Check models
        run: |
          java -version
          GLOVE_TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" scripts/tlc.sh

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -stdlib=libc++

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # clang-tools has clang-scan-deps, which CMake runs for every C++23
          # translation unit. The preflight job gets it through clang-tidy.
          sudo apt-get install --yes clang clang-tools llvm libc++-dev libc++abi-dev libseccomp-dev libssl-dev ninja-build

      - name: Allow unprivileged user namespaces
        # The sandbox tests need them, and Ubuntu's AppArmor default refuses.
        # scripts/preflight.sh does the same under GLOVE_PREPARE_LINUX_USERNS.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Measure
        # Reports a figure; it enforces no threshold. A failing test fails the
        # job, because the figure would then leave out what did not run.
        run: scripts/coverage.sh

      - name: Summarize
        if: always()
        run: |
          report=build/coverage/report/summary.txt
          if [[ -f "$report" ]]; then
            {
              echo '### Test coverage (Linux, unprivileged tests)'
              echo '```text'
              head -n 2 "$report"
              tail -n 1 "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
